<p>{{title}}</p>
<p>{{request.user.is_authenticated}}</p>
<p>{{view}}</p>

<div class="card mb-3 border-0 nth-shadow">
    <div class="card-body">
        <div class="card-title nth-card-title">
        </div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.media }}
            {{ form.as_p }}
            <div class="d-grid gap-2 d-md-block mt-2">
                <button type="submit" class="btn btn-dark">Добавить квиз</button>
            </div>
        </form>
    </div>
</div>
